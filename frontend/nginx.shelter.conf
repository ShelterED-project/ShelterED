server {
    listen 80;
    server_name shelter.local 192.168.1.*;

    # Service Worker і маніфест не кешуються: інакше нова версія застосунку дійде із запізненням.
    # Точний збіг (=) має пріоритет над правилами з регулярними виразами нижче.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Агресивне кешування для роботи офлайн
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json|svg)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Медіа уроків (відео, зображення, VTT) зі спільного тому backend; ^~ — щоб правило
    # кешування статики вище (.png тощо) не перехоплювало /media/. Range для відео — вбудований.
    location ^~ /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Оригінали відео до стиснення (можуть містити метадані телефона) назовні не віддаємо.
    location ^~ /media/video_source/ {
        return 404;
    }

    # Завантаження медіа: відео до 30 МБ, оригінал для стиснення на сервері — до 300 МБ.
    location ^~ /api/media/ {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
