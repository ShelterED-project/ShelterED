server {
    listen 80;
    server_name shelter.local 192.168.1.*;

    # Service Worker і маніфест не кешуються: інакше нова версія застосунку дійде із запізненням.
    # Точний збіг (=) має пріоритет над правилами з регулярними виразами нижче.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Агресивне кешування для роботи офлайн
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json|svg)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
