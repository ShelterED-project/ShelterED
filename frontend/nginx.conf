server {
    listen 80;
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/shelter.crt;
    ssl_certificate_key /etc/nginx/ssl/shelter.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Service Worker і маніфест не кешуються: інакше нова версія застосунку дійде із запізненням.
    # Точний збіг (=) має пріоритет над правилами з регулярними виразами нижче.
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Медіа уроків (відео, зображення, VTT) зі спільного тому backend. Range для відео — вбудований.
    location ^~ /media/ {
        alias /srv/media/;
        add_header Cache-Control "public, max-age=604800";
    }

    # Оригінали відео до стиснення (можуть містити метадані телефона) назовні не віддаємо.
    location ^~ /media/video_source/ {
        return 404;
    }

    # Завантаження медіа: відео до 30 МБ, оригінал для стиснення на сервері — до 300 МБ.
    location ^~ /api/media/ {
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
