# Спільне для backend і Celery. БД — Neon: DATABASE_URL (pooled) і DATABASE_URL_DIRECT (міграції)
# беруться з .env поруч (деплой заповнює їх із GitHub Secrets), як і JWT, VAPID, AI_*.
x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_REDIS_URL: redis://redis:6379/2
  ENVIRONMENT: ${APP_ENV:-prod}
  JWT_SECRET: ${JWT_SECRET}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: shelter_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_backend
    restart: unless-stopped
    # Під час старту застосовує міграції до Neon (alembic upgrade head через DATABASE_URL_DIRECT),
    # потім uvicorn — див. backend/start.sh.
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 300M
    logging: *logging

  celery_worker:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,push,sync", "--concurrency=1", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *app-env
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 200M
    logging: *logging

  # Окремий воркер для стиснення відео (ffmpeg, до 25 хв): не блокує push, синхронізацію й тривоги.
  celery_media:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery_media
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "media", "--concurrency=1", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *app-env
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          # ffmpeg (720p) потребує ~200–300 МБ.
          memory: 512M
    logging: *logging

  # Розклад періодичних задач: тривоги, черга відправки, пакети, агрегати, пояснення ШІ.
  celery_beat:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-env
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  frontend:
    image: ghcr.io/sheltered-project/sheltered/frontend:latest
    container_name: shelter_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx віддає медіа уроків напряму зі спільного тому.
      - media_data:/srv/media:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

volumes:
  media_data:
