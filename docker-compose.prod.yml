services:
  db:
    image: postgres:15-alpine
    container_name: shelter_db
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shelter_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: shelter_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 300M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,push,sync", "--concurrency=1", "--loglevel=info"]
    profiles: ["cloud"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 150M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Окремий воркер для стиснення відео (ffmpeg, до 25 хв): не блокує push, синхронізацію й тривоги.
  celery_media:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery_media
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "media", "--concurrency=1", "--loglevel=info"]
    profiles: ["cloud"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          # ffmpeg (720p) потребує ~200–300 МБ.
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/sheltered-project/sheltered/frontend:latest
    container_name: shelter_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx віддає медіа уроків напряму зі спільного тому.
      - media_data:/srv/media:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  media_data:
