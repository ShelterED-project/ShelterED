# Спільне для backend і Celery: решта налаштувань (JWT_SECRET, VAPID, AI_*, ...) — у .env поруч.
x-app-env: &app-env
  # Драйвер asyncpg і TLS бекенд підбирає сам (postgresql:// → asyncpg; БД у контейнері — без TLS).
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_REDIS_URL: redis://redis:6379/2
  ENVIRONMENT: ${APP_ENV:-prod}
  JWT_SECRET: ${JWT_SECRET}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    container_name: shelter_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelter_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Новий том під PostgreSQL 17 (дані 15 несумісні). Старий том postgres_data не видаляється —
      # лишається резервною копією; дамп і відновлення — див. README бекенду.
      - postgres17_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shelter_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: shelter_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging

  backend:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_backend
    restart: unless-stopped
    # Під час старту застосовує міграції (alembic upgrade head), потім uvicorn — див. backend/start.sh.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 300M
    logging: *logging

  celery_worker:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,push,sync", "--concurrency=1", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *app-env
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          memory: 200M
    logging: *logging

  # Окремий воркер для стиснення відео (ffmpeg, до 25 хв): не блокує push, синхронізацію й тривоги.
  celery_media:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery_media
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "media", "--concurrency=1", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment: *app-env
    volumes:
      - media_data:/app/media
    deploy:
      resources:
        limits:
          # ffmpeg (720p) потребує ~200–300 МБ.
          memory: 512M
    logging: *logging

  # Розклад періодичних задач: тривоги, черга відправки, пакети, агрегати, пояснення ШІ.
  celery_beat:
    image: ghcr.io/sheltered-project/sheltered/backend:latest
    container_name: shelter_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-env
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  frontend:
    image: ghcr.io/sheltered-project/sheltered/frontend:latest
    container_name: shelter_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx віддає медіа уроків напряму зі спільного тому.
      - media_data:/srv/media:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

volumes:
  # Дані PostgreSQL 15 (до переходу на 17) — не видаляти, доки не перевірено відновлення.
  postgres_data:
  postgres17_data:
  media_data:
