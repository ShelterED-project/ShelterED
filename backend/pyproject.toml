[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sheltered-backend"
version = "0.1.0"
description = "ShelterED cloud API"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
