services:
  db:
    image: postgres:15-alpine
    container_name: shelter_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shelter_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shelter_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shelter_redis
    restart: unless-stopped
    profiles: ["cloud"]
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelter_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${APP_ENV:-production}
    deploy:
      resources:
        limits:
          memory: 300M

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shelter_celery
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--concurrency=1", "--loglevel=info"]
    profiles: ["cloud"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelter_db}
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        limits:
          memory: 150M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shelter_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
