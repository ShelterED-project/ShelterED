<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelterED - Панель вчителя</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .logo { font-size: 20px; font-weight: bold; color: #fbbf24; }
        h1 { font-size: 24px; color: #fbbf24; margin-bottom: 20px; }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { background-color: #2a2a2a; color: #fbbf24; font-weight: normal; }
        tr:last-child td { border-bottom: none; }
        .status-safe {
            background-color: #065f46;
            color: #34d399;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-refresh {
            background-color: #fbbf24;
            color: #121212;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">ShelterED</div>
        <a href="/teacher" class="btn-refresh">Оновити список</a>
    </div>

    <h1>Перекличка класу</h1>

    <table>
        <thead>
            <tr>
                <th>Ім'я учня</th>
                <th>Статус</th>
                <th>Час</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.student_name }}</td>
                <td><span class="status-safe">{{ student.status }}</span></td>
                <td>{{ student.created_at.strftime('%H:%M:%S') }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center; color: #a0a0a0;">Ніхто ще не відмітився</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
