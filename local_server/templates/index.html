<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ShelterED - Перекличка</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; padding: 20px; }
        h1 { color: #fbbf24; }
        .form-container { margin-bottom: 30px; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; font-size: 16px; background-color: #fbbf24; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #444; }
        th { color: #fbbf24; }
    </style>
</head>
<body>
    <h1>Перекличка в укритті</h1>

    <div class="form-container">
        <form action="/roll-call" method="post">
            <input type="text" name="student_name" placeholder="Твоє ім'я" required>
            <button type="submit">Я в укритті!</button>
        </form>
    </div>

    <h2>Зараз в укритті:</h2>
    <table>
        <tr>
            <th>Ім'я</th>
            <th>Час</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.student_name }}</td>
            <td>{{ student.created_at.strftime('%H:%M:%S') }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
