<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelterED - Я в укритті</title>
    <style>
        /* Базові стилі */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            color: #fbbf24;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* жовта кнопка */
        button {
            width: 100%;
            padding: 16px;
            background-color: #fbbf24;
            color: #121212;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #f59e0b;
        }
    </style>
</head>
<body>

    <div class="logo">ShelterED</div>

    <div class="card">
        <h1>Перекличка</h1>
        <p>Будь ласка, підтвердіть, що ви в безпеці</p>

        <form action="/roll-call" method="post">
            <input type="text" name="student_name" placeholder="Твоє ім'я" required>
            <button type="submit">Я в укритті</button>
        </form>
    </div>

</body>
</html>
