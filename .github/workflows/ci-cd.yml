name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Ручний запуск деплою (Actions → CI/CD Pipeline → Run workflow), за потреби з демо-даними.
  workflow_dispatch:
    inputs:
      seed:
        description: "Заповнити демо-даними (python -m app.cli seed --allow-prod; потрібен секрет SEED_PASSWORD)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sheltered
          POSTGRES_PASSWORD: sheltered
          POSTGRES_DB: sheltered_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sheltered -d sheltered_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout коду
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f "backend/pyproject.toml" ] || [ -f "backend/setup.py" ]; then
            pip install -e backend/
          elif [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            pip install -e .
          fi

      - name: Запуск лінтера Ruff
        run: |
          ruff check backend/

      - name: Запуск лінтера Flake8
        run: |
          flake8 backend/ --max-line-length=120 --exclude=venv,__pycache__

      - name: Запуск автоматичних тестів pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/

  docker-build-push:
    needs: backend-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout коду
        uses: actions/checkout@v4

      - name: Підготовка назви репозиторію в нижньому регістрі
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Логін у GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Налаштування Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/frontend:latest
  deploy:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Деплой на AWS EC2 по SSH
        uses: appleboy/ssh-action@v1
        env:
          AI_SERVICE_URL: ${{ secrets.AI_SERVICE_URL }}
          AI_INTERNAL_KEY: ${{ secrets.AI_INTERNAL_KEY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          RUN_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed && 'true' || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AI_SERVICE_URL,AI_INTERNAL_KEY,SEED_PASSWORD,RUN_SEED
          script_stop: true
          script: |
            set -e
            cd ~/shelter-app
            git fetch origin main
            git checkout -B main origin/main

            # Секрети з GitHub → .env (лише непорожні; значення в лог не друкуються).
            touch .env && chmod 600 .env
            upsert() {
              [ -z "$2" ] && return 0
              grep -v "^$1=" .env > .env.tmp || true
              printf '%s=%s\n' "$1" "$2" >> .env.tmp
              mv .env.tmp .env && chmod 600 .env
            }
            upsert AI_SERVICE_URL "$AI_SERVICE_URL"
            upsert AI_INTERNAL_KEY "$AI_INTERNAL_KEY"

            docker compose -f docker-compose.prod.yml pull

            # Одноразовий перехід PostgreSQL 15 → 17: дамп старого тому, відновлення в новий.
            # Старий том (postgres_data) не видаляється — лишається резервною копією.
            PROJECT=$(basename "$PWD")
            DB_USER=$(grep -E '^POSTGRES_USER=' .env | cut -d= -f2- || true); DB_USER=${DB_USER:-postgres}
            if docker volume inspect "${PROJECT}_postgres_data" >/dev/null 2>&1 && ! docker volume inspect "${PROJECT}_postgres17_data" >/dev/null 2>&1; then
              echo "PostgreSQL 15 → 17: дамп старої БД"
              docker stop shelter_db >/dev/null 2>&1 || true
              docker run -d --rm --name pg15_dump -v "${PROJECT}_postgres_data:/var/lib/postgresql/data" postgres:15-alpine
              for i in $(seq 1 30); do docker exec pg15_dump pg_isready -U "$DB_USER" >/dev/null 2>&1 && break; sleep 2; done
              if ! docker exec pg15_dump pg_dumpall -U "$DB_USER" > ~/pg15-backup.sql; then
                echo "Дамп не вдався: повертаю PostgreSQL 15, деплой зупинено"
                docker stop pg15_dump; rm -f ~/pg15-backup.sql; docker start shelter_db; exit 1
              fi
              docker stop pg15_dump
              ls -la ~/pg15-backup.sql
            fi
            if [ -s ~/pg15-backup.sql ]; then
              docker compose -f docker-compose.prod.yml up -d db
              for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' shelter_db)" = healthy ] && break; sleep 2; done
              echo "PostgreSQL 17: відновлення з дампу"
              docker exec -i shelter_db psql -q -U "$DB_USER" -d postgres < ~/pg15-backup.sql > /dev/null || true
              mv ~/pg15-backup.sql ~/pg15-backup.restored.sql
            fi

            # Бекенд при старті сам застосовує міграції (backend/start.sh).
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            if [ "$RUN_SEED" = "true" ]; then
              if [ -z "$SEED_PASSWORD" ]; then echo "SEED_PASSWORD secret is not set"; exit 1; fi
              for i in $(seq 1 30); do docker exec shelter_backend python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')" >/dev/null 2>&1 && break; sleep 3; done
              docker exec -e SEED_PASSWORD="$SEED_PASSWORD" shelter_backend python -m app.cli seed --allow-prod
            fi
            curl -fsS http://127.0.0.1:8000/health && echo
